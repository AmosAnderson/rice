[package]
name = "rice"
version = "0.13.0"
edition = "2024"
default-run = "rice"
license = "MIT"

[lib]
crate-type = ["lib"]

[dependencies]
thiserror = "2"
rustyline = "17"
tower-lsp = "0.20"
tokio = { version = "1", features = ["full"] }
crossterm = "0.28"

[[bin]]
name = "rice"
path = "src/main.rs"

[[bin]]
name = "rice-lsp"
path = "src/bin/rice_lsp.rs"

[dev-dependencies]
tempfile = "3"
