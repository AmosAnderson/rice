name: Release

on:
  push:
    tags:
      - '**'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag on master to build and release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Check tag is on master
    if: github.event.deleted != true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      eligible: ${{ steps.tag.outputs.eligible }}
      tag: ${{ steps.tag.outputs.tag }}
      commit: ${{ steps.tag.outputs.commit }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve tag and check master history
        id: tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          git check-ref-format "refs/tags/$TAG"
          commit=$(git rev-parse --verify "refs/tags/$TAG^{commit}")
          if [[ "$EVENT_NAME" == push ]]; then
            test "$commit" = "$(git rev-parse --verify "$EVENT_SHA^{commit}")"
          fi
          if ! git merge-base --is-ancestor "$commit" origin/master; then
            echo "Tag is not on master; no release will be published." >> "$GITHUB_STEP_SUMMARY"
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version=$(git show "$commit:Cargo.toml" | python3 -c 'import sys, tomllib; print(tomllib.loads(sys.stdin.read())["package"]["version"])')
          echo "eligible=true" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: validate
    if: needs.validate.outputs.eligible == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            extension: ''
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            extension: ''
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            extension: .exe
          - os: macos-15
            target: aarch64-apple-darwin
            extension: ''
          - os: macos-15-intel
            target: x86_64-apple-darwin
            extension: ''
    env:
      CARGO_TERM_COLOR: always
      RUST_MIN_STACK: '8388608'
      TARGET: ${{ matrix.target }}
      EXE: ${{ matrix.extension }}
      PACKAGE: rice-${{ needs.validate.outputs.version }}-${{ matrix.target }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --target "$TARGET"
      - name: Test
        run: cargo +stable test --locked --target "$TARGET"
      - name: Build release binaries
        run: cargo +stable build --locked --release --bins --target "$TARGET"
      - name: Smoke test release interpreter
        run: test "$("target/$TARGET/release/rice$EXE" tests/programs/hello.bas | tr -d '\r')" = 'Hello, World!'
      - name: Stage binaries and documentation
        run: |
          mkdir -p "dist/$PACKAGE"
          cp "target/$TARGET/release/rice$EXE" "target/$TARGET/release/rice-lsp$EXE" "dist/$PACKAGE/"
          cp README.md LICENSE SYNTAX.md "dist/$PACKAGE/"
          cp -R docs "dist/$PACKAGE/"
      - name: Archive Linux and macOS binaries
        if: runner.os != 'Windows'
        run: tar -czf "dist/$PACKAGE.tar.gz" -C dist "$PACKAGE"
      - name: Archive Windows binaries
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist/$env:PACKAGE" -DestinationPath "dist/$env:PACKAGE.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error
          overwrite: true
          compression-level: 0
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: [validate, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.validate.outputs.tag }}
      COMMIT: ${{ needs.validate.outputs.commit }}
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false
      - name: Recheck tag before publishing
        shell: bash
        run: |
          test "$(git rev-parse --verify "refs/tags/$TAG^{commit}")" = "$COMMIT"
          git merge-base --is-ancestor "$COMMIT" origin/master
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Generate checksums
        working-directory: dist
        shell: bash
        run: |
          archives=(
            "rice-$VERSION-x86_64-unknown-linux-gnu.tar.gz"
            "rice-$VERSION-aarch64-unknown-linux-gnu.tar.gz"
            "rice-$VERSION-x86_64-pc-windows-msvc.zip"
            "rice-$VERSION-aarch64-apple-darwin.tar.gz"
            "rice-$VERSION-x86_64-apple-darwin.tar.gz"
          )
          for archive in "${archives[@]}"; do
            test -s "$archive"
          done
          sha256sum "${archives[@]}" > SHA256SUMS
      - name: Create or update release
        shell: bash
        run: |
          if is_draft=$(gh release view --json isDraft --jq '.isDraft' -- "$TAG"); then
            if [[ "$is_draft" != true ]]; then
              echo "Release is already published; leaving its assets unchanged." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          else
            gh release create --verify-tag --target "$COMMIT" --title "Rice BASIC $TAG" --generate-notes --draft -- "$TAG"
          fi
          gh release upload --clobber -- "$TAG" dist/*.tar.gz dist/*.zip dist/SHA256SUMS
          gh release edit --draft=false -- "$TAG"
